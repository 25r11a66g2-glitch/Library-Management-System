<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='CSS/register.css') }}">
</head>

<body>

    <div class="register-container">

        <h1>📚 Student Registration</h1>

        <p>Create your library account</p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label>Roll Number</label>
            <input type="text" id="rollNumber"
                   placeholder="Enter your roll number" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit">Register</button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login Here</a>
        </p>

        <a href="/" class="home-link">Back to Home</a>

    </div>

    <script src="{{ url_for('static', filename='JavaScript/register.js') }}"></script>

</body>

</html>
